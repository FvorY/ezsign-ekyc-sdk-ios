name: EzsignEkycExample
options:
  bundleIdPrefix: io.github.fvory
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

packages:
  EzsignEkycSDK:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  EzsignEkycExample:
    type: application
    platform: iOS
    sources:
      - EzsignEkycExample
    dependencies:
      - package: EzsignEkycSDK
      - sdk: CoreMotion.framework
      - sdk: MediaPlayer.framework
      - sdk: ReplayKit.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
    info:
      path: EzsignEkycExample/Info.plist
      properties:
        NSCameraUsageDescription: Kamera diperlukan untuk verifikasi keaktifan wajah (liveness check).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fvory.ekyc.example
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  EzsignEkycExample:
    build:
      targets:
        EzsignEkycExample: all
    run:
      config: Debug
